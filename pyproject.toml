[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "epi_pipeline"
version = "0.0.1"
description = "A command-line tool that takes raw surveillance-style data (case counts by place and time), validates and cleans it, computes standard epidemiological indicators, flags unusual increases, and produces report-ready outputs."
authors = [
  { name = "Taonga Jere" },
]
readme = "README.md"
requires-python = "~=3.12.0"
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    "pandas",
    "typer",
    "matplotlib",
    "pyyaml"
]

[project.scripts]
epi_pipeline = "epi_pipeline.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 99
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
)/
'''

[tool.isort]
profile = "black"
known_first_party = ["epi_pipeline"]
force_sort_within_sections = true